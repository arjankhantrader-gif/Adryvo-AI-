<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Adryvo - AI Image Generator</title>
    
    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDz8dCn5cjop7gptfMEsSNkAG035D-qkYo",
            authDomain: "adryvo-ai.firebaseapp.com",
            projectId: "adryvo-ai",
            storageBucket: "adryvo-ai.firebasestorage.app",
            messagingSenderId: "1018885451999",
            appId: "1:1018885451999:web:32d8f99be5e4f7fde7f96a",
            measurementId: "G-NGXFN0ZH82"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        let currentUser = null;
        let activeGenerationImageUrl = '';
        let activeGenerationPrompt = '';

        auth.onAuthStateChanged((user) => {
            currentUser = user;
            if (user) {
                document.getElementById('profile-email').innerText = user.email;
                document.getElementById('profile-name').innerText = user.displayName || user.email.split('@')[0];
                document.getElementById('settings-email-display').innerText = user.email;
                // Hide Login/Signup from Profile Menu when logged in
                // Optional: You might need to add IDs to menu items to toggle them
            } else {
                document.getElementById('profile-email').innerText = 'Not signed in';
                document.getElementById('profile-name').innerText = 'Guest User';
                document.getElementById('settings-email-display').innerText = 'Not signed in';
            }
            updateProfileStats();
        });

        // STEP 1: Splash Screen Handler & Redirect to Login
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const splash = document.getElementById('view-splash');
                if (splash) {
                    splash.style.opacity = '0';
                    setTimeout(() => { 
                        splash.style.display = 'none'; 
                        // Force redirect to Login Screen first!
                        switchTab('login');
                    }, 400);
                }
            }, 2000);
        });

        // Screen Switcher Router
        function switchTab(tabId) {
            const views = [
                'splash', 'login', 'signup', 'home', 'explore', 'creations', 
                'generating', 'result', 'details', 'templates', 'profile', 'pricing', 'settings'
            ];
            views.forEach(v => {
                const el = document.getElementById(`view-${v}`);
                if (el) el.style.display = 'none';
            });

            // Update bottom nav state (Step 14)
            const navTabs = ['home', 'explore', 'creations', 'profile'];
            document.querySelectorAll('.bottom-nav-item').forEach(item => item.classList.remove('active'));
            
            // Only show nav tabs if user is NOT on login/signup
            if (navTabs.includes(tabId)) {
                document.getElementById('bottom-nav-bar').style.display = 'flex';
                const activeNav = document.getElementById(`nav-${tabId}`);
                if (activeNav) activeNav.classList.add('active');
            } else {
                document.getElementById('bottom-nav-bar').style.display = 'none';
            }

            const target = document.getElementById(`view-${tabId}`);
            if (target) {
                target.style.display = 'block';
                target.classList.add('fade-in');
            }

            if(tabId === 'creations') loadHistoryGallery();
            if(tabId === 'explore') loadExploreGrid();
            if(tabId === 'profile') updateProfileStats();
            
            window.scrollTo(0, 0);
        }

        // Global Back Navigation Handler
        function goBack() {
            const currentVisible = document.querySelector('.content-scroll > div:not([style*="display: none"])');
            if (!currentVisible) { switchTab('home'); return; }
            const id = currentVisible.id;
            if (id === 'view-details' || id === 'view-result') switchTab('creations');
            else if (id === 'view-signup') switchTab('login');
            else if (['view-pricing', 'view-settings', 'view-templates', 'view-explore', 'view-creations', 'view-profile'].includes(id)) switchTab('home');
            else switchTab('home');
        }

        function handleGuestLogin() {
            alert("Continuing as Guest. Some features might be limited.");
            switchTab('home');
        }

        function handleGoogleLogin() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).then(() => {
                alert("Logged in successfully with Google!");
                switchTab('home');
            }).catch(err => alert(err.message));
        }

        function handleEmailLogin() {
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-pass').value;
            if(!email || !pass) { alert("Please enter email & password"); return; }
            auth.signInWithEmailAndPassword(email, pass)
                .then(() => { alert("Login successful!"); switchTab('home'); })
                .catch(err => alert(err.message));
        }

        function handleSignUp() {
            const email = document.getElementById('signup-email').value;
            const pass = document.getElementById('signup-pass').value;
            if(!email || !pass) { alert("Please enter details"); return; }
            auth.createUserWithEmailAndPassword(email, pass)
                .then(() => { alert("Account created and logged in successfully!"); switchTab('home'); })
                .catch(err => alert(err.message));
        }

        function handleLogout() {
            auth.signOut().then(() => { 
                alert("Logged out successfully");
                switchTab('login'); 
            });
        }

        function updateProfileStats() {
            const userId = currentUser ? currentUser.uid : 'guest';
            let history = JSON.parse(localStorage.getItem(`adryvo_history_${userId}`) || '[]');
            document.getElementById('stat-images-count').innerText = history.length > 0 ? history.length : '0';
        }

        // AI Generation Flow with All Options
        function startAIGeneration() {
            const promptInput = document.getElementById('ai-prompt').value;
            if(!promptInput.trim()) { alert("Please enter a prompt!"); return; }

            activeGenerationPrompt = promptInput;
            document.getElementById('gen-prompt-text').innerText = `"${promptInput}"`;
            
            switchTab('generating');

            const model = document.getElementById('opt-model').value;
            const style = document.getElementById('opt-style').value;
            const aspect = document.getElementById('opt-aspect').value;
            const quality = document.getElementById('opt-quality').value;

            let width = 1024, height = 1024;
            if(aspect === '16:9') { width = 1344; height = 768; }
            else if(aspect === '9:16') { width = 768; height = 1344; }
            else if(aspect === '4:5') { width = 864; height = 1080; }

            const fullPrompt = `${promptInput}, model-${model}, style-${style}, quality-${quality}, masterpiece, highly detailed`;
            const encodedPrompt = encodeURIComponent(fullPrompt);
            const seed = Math.floor(Math.random() * 9999999);
            const rawImageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?model=flux&width=${width}&height=${height}&seed=${seed}&nologo=true`;

            const img = new Image();
            img.crossOrigin = "anonymous";
            img.src = rawImageUrl;

            img.onload = function() {
                const canvas = document.createElement('canvas');
                canvas.width = img.width;
                canvas.height = img.height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);

                activeGenerationImageUrl = canvas.toDataURL('image/jpeg', 0.98);

                setTimeout(() => {
                    document.getElementById('result-image-view').src = activeGenerationImageUrl;
                    document.getElementById('download-btn-link').href = activeGenerationImageUrl;
                    switchTab('result');
                }, 1500);
            };

            img.onerror = function() {
                alert("Generation failed. Please try again.");
                switchTab('home');
            };
        }

        function saveCurrentCreation() {
            const userId = currentUser ? currentUser.uid : 'guest';
            let history = JSON.parse(localStorage.getItem(`adryvo_history_${userId}`) || '[]');
            
            history.unshift({ 
                url: activeGenerationImageUrl, 
                prompt: activeGenerationPrompt, 
                date: new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) 
            });
            localStorage.setItem(`adryvo_history_${userId}`, JSON.stringify(history));
            alert("Saved to My Creations successfully!");
            updateProfileStats();
        }

        function loadHistoryGallery() {
            const userId = currentUser ? currentUser.uid : 'guest';
            const grid = document.getElementById('history-grid');
            let history = JSON.parse(localStorage.getItem(`adryvo_history_${userId}`) || '[]');
            
            if (history.length === 0) {
                grid.innerHTML = `<div class="empty-state"><p>No creations found yet. Generate your first AI artwork from Home!</p></div>`;
                return;
            }

            grid.innerHTML = history.map((item) => `
                <div class="gallery-item fade-in" onclick="openDetails('${item.url}', '${item.prompt}')">
                    <img src="${item.url}" alt="${item.prompt}">
                    <div class="gallery-info">
                        <p>${item.prompt}</p>
                        <span>${item.date}</span>
                    </div>
                </div>
            `).join('');
        }

        function loadExploreGrid() {
            const exploreGrid = document.getElementById('explore-grid');
            const samplePrompts = [
                { title: "Cyberpunk City", url: "https://image.pollinations.ai/prompt/cyberpunk%20city%20neon%20lights%20rain?nologo=true" },
                { title: "Astronaut in Space", url: "https://image.pollinations.ai/prompt/astronaut%20floating%20in%20deep%20space%20nebula?nologo=true" },
                { title: "Mystical Dragon", url: "https://image.pollinations.ai/prompt/majestic%20fire%20dragon%20flying%20over%20mountains?nologo=true" },
                { title: "Anime Girl", url: "https://image.pollinations.ai/prompt/cute%20anime%20girl%20cherry%20blossom%20spring?nologo=true" },
                { title: "Luxury Supercar", url: "https://image.pollinations.ai/prompt/luxury%20supercar%20speeding%20on%20desert%20highway?nologo=true" },
                { title: "Fantasy Castle", url: "https://image.pollinations.ai/prompt/magical%20floating%20fantasy%20castle%20waterfall?nologo=true" }
            ];

            exploreGrid.innerHTML = samplePrompts.map(item => `
                <div class="creation-card" onclick="useTemplatePrompt('${item.title}')">
                    <img src="${item.url}" alt="${item.title}">
                    <div class="card-tag">✨ ${item.title}</div>
                </div>
            `).join('');
        }

        function openDetails(url, prompt) {
            document.getElementById('details-img').src = url;
            document.getElementById('details-prompt').innerText = prompt;
            document.getElementById('details-download-btn').href = url;
            switchTab('details');
        }

        function useTemplatePrompt(text) {
            document.getElementById('ai-prompt').value = text;
            switchTab('home');
        }

        function shareImage() {
            if (navigator.share) {
                navigator.share({
                    title: 'Adryvo AI Generation',
                    text: `Check out this AI creation generated with Adryvo: "${activeGenerationPrompt}"`,
                    url: activeGenerationImageUrl
                }).catch(console.error);
            } else {
                navigator.clipboard.writeText(activeGenerationImageUrl);
                alert("Image URL copied to clipboard!");
            }
        }
    </script>

    <style>

            --bg-deep: #05070f;

        .bottom-nav-item.active { color: var(--primary); text-shadow: 0 0 10px rgba(59, 130, 246, 0.6); }
        .bottom-nav-item svg { width: 20px; height: 20px; fill: currentColor; }

        .gallery-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
        .gallery-item { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 14px; overflow: hidden; cursor: pointer; }
        .gallery-item img { width: 100%; height: 200px; object-fit: cover; }
        .gallery-info { padding: 10px; }
        .gallery-info p { font-size: 12px; font-weight: 600
