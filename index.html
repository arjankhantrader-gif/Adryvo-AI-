<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adryvo-AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        #home-screen h1, #dashboard-screen h1 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #38bdf8;
        }

        #home-screen p, #dashboard-screen p {
            color: #94a3b8;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .btn-primary {
            background-color: #38bdf8;
            color: #0f172a;
            margin-top: 10px;
        }

        .btn-primary:hover {
            background-color: #0ea5e9;
        }

        .btn-danger {
            background-color: #ef4444;
            color: #fff;
            margin-top: 15px;
        }

        .btn-danger:hover {
            background-color: #dc2626;
        }

        .auth-screen, #dashboard-screen {
            display: none;
            text-align: left;
        }

        .auth-screen h2 {
            margin-bottom: 20px;
            font-size: 22px;
            text-align: center;
            color: #f8fafc;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            margin-bottom: 5px;
            color: #cbd5e1;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            border-radius: 6px;
            font-size: 14px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #38bdf8;
        }

        .switch-text {
            margin-top: 15px;
            text-align: center;
            font-size: 13px;
            color: #94a3b8;
        }

        .switch-text span {
            color: #38bdf8;
            cursor: pointer;
            font-weight: 600;
        }

        .back-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            margin-top: 10px;
            cursor: pointer;
            font-size: 13px;
            width: 100%;
            text-align: center;
        }

        .back-btn:hover {
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Home / Welcome Screen -->
        <div id="home-screen" style="text-align: center;">
            <h1>Adryvo-AI</h1>
            <p>Your intelligent AI companion for modern workflows.</p>
            <button class="btn btn-primary" onclick="showAuth('login')">Get Started</button>
        </div>

        <!-- Login Screen -->
        <div id="login-screen" class="auth-screen">
            <h2>Welcome Back</h2>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="login-email" placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="login-pass" placeholder="Enter your password">
            </div>
            <button class="btn btn-primary" onclick="handleLogin()">Login</button>
            <p class="switch-text">Don't have an account? <span onclick="showAuth('signup')">Sign Up</span></p>
            <button class="back-btn" onclick="showHome()">Back</button>
        </div>

        <!-- Sign Up Screen -->
        <div id="signup-screen" class="auth-screen">
            <h2>Create Account</h2>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="signup-email" placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="signup-pass" placeholder="Create a password">
            </div>
            <button class="btn btn-primary" onclick="handleSignUp()">Sign Up</button>
            <p class="switch-text">Already have an account? <span onclick="showAuth('login')">Login</span></p>
            <button class="back-btn" onclick="showHome()">Back</button>
        </div>

        <!-- Dashboard Screen (After Login) -->
        <div id="dashboard-screen" style="text-align: center;">
            <h1>Dashboard</h1>
            <p>Welcome to Adryvo-AI! You are successfully logged in.</p>
            <button class="btn btn-danger" onclick="handleLogout()">Logout</button>
        </div>
    </div>

    <!-- Link to external JavaScript file -->
    <script type="module" src="script.js"></script>

</body>
</html>
