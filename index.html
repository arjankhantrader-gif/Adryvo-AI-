<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adryvo-AI - Dashboard</title>
    
    <!-- Firebase App & Auth CDN (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <script>
        // Your Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDz8dCn5cjop7gptfMEsSNkAG035D-qkYo",
            authDomain: "adryvo-ai.firebaseapp.com",
            projectId: "adryvo-ai",
            storageBucket: "adryvo-ai.firebasestorage.app",
            messagingSenderId: "1018885451999",
            appId: "1:1018885451999:web:32d8f99be5e4f7fde7f96a",
            measurementId: "G-NGXFN0ZH82"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // Functions for Auth
        function handleSignUp() {
            const email = document.getElementById('signup-email').value;
            const pass = document.getElementById('signup-pass').value;
            if(!email || !pass) {
                alert("Please fill all fields");
                return;
            }
            auth.createUserWithEmailAndPassword(email, pass)
                .then(() => {
                    showDashboard();
                })
                .catch((error) => {
                    alert(error.message);
                });
        }

        function handleLogin() {
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-pass').value;
            if(!email || !pass) {
                alert("Please fill all fields");
                return;
            }
            auth.signInWithEmailAndPassword(email, pass)
                .then(() => {
                    showDashboard();
                })
                .catch((error) => {
                    alert(error.message);
                });
        }

        function handleLogout() {
            auth.signOut().then(() => {
                showHome();
            }).catch((error) => {
                alert(error.message);
            });
        }

        auth.onAuthStateChanged((user) => {
            if (user) {
                showDashboard();
            } else {
                showHome();
            }
        });

        // AI Image Generation Mock Function (Can be connected to Pollinations/HuggingFace API later)
        function generateImage() {
            const prompt = document.getElementById('ai-prompt').value;
            const resultArea = document.getElementById('image-result');
            
            if(!prompt) {
                alert("Please enter a prompt to generate an image!");
                return;
            }

            resultArea.innerHTML = `<p style="color: #38bdf8;">Generating image for "${prompt}"...</p>`;
            
            // Using Pollinations AI free API for real image generation based on text prompt
            setTimeout(() => {
                const encodedPrompt = encodeURIComponent(prompt);
                const imageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}`;
                
                resultArea.innerHTML = `
                    <div style="margin-top: 15px;">
                        <img src="${imageUrl}" alt="${prompt}" style="width: 100%; max-height: 300px; border-radius: 8px; object-fit: cover;">
                        <p style="font-size: 12px; color: #94a3b8; margin-top: 5px;">Prompt: ${prompt}</p>
                    </div>
                `;
            }, 1000);
        }
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 26px;
            margin-bottom: 10px;
            color: #38bdf8;
            text-align: center;
        }

        p {
            color: #94a3b8;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .btn-primary {
            background-color: #38bdf8;
            color: #0f172a;
            margin-top: 10px;
        }

        .btn-primary:hover {
            background-color: #0ea5e9;
        }

        .btn-danger {
            background-color: #ef4444;
            color: #fff;
            margin-top: 15px;
        }

        .btn-danger:hover {
            background-color: #dc2626;
        }

        .auth-screen, #dashboard-screen {
            display: none;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            margin-bottom: 5px;
            color: #cbd5e1;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            border-radius: 6px;
            font-size: 14px;
        }

        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: #38bdf8;
        }

        .switch-text {
            margin-top: 15px;
            text-align: center;
            font-size: 13px;
            color: #94a3b8;
        }

        .switch-text span {
            color: #38bdf8;
            cursor: pointer;
            font-weight: 600;
        }

        .back-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            margin-top: 10px;
            cursor: pointer;
            font-size: 13px;
            width: 100%;
            text-align: center;
        }

        .back-btn:hover {
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Home / Welcome Screen -->
        <div id="home-screen">
            <h1>Adryvo-AI</h1>
            <p>Your intelligent AI companion for modern workflows.</p>
            <button class="btn btn-primary" onclick="showAuth('login')">Get Started</button>
        </div>

        <!-- Login Screen -->
        <div id="login-screen" class="auth-screen">
            <h1>Welcome Back</h1>
            <p>Login to access your AI studio.</p>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="login-email" placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="login-pass" placeholder="Enter your password">
            </div>
            <button class="btn btn-primary" onclick="handleLogin()">Login</button>
            <p class="switch-text">Don't have an account? <span onclick="showAuth('signup')">Sign Up</span></p>
            <button class="back-btn" onclick="showHome()">Back</button>
        </div>

        <!-- Sign Up Screen -->
        <div id="signup-screen" class="auth-screen">
            <h1>Create Account</h1>
            <p>Join Adryvo-AI today.</p>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="signup-email" placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="signup-pass" placeholder="Create a password">
            </div>
            <button class="btn btn-primary" onclick="handleSignUp()">Sign Up</button>
            <p class="switch-text">Already have an account? <span onclick="showAuth('login')">Login</span></p>
            <button class="back-btn" onclick="showHome()">Back</button>
        </div>

        <!-- Dashboard / AI Studio Screen -->
        <div id="dashboard-screen" class="auth-screen">
            <h1>AI Studio</h1>
            <p>Generate high-quality AI images instantly.</p>
            
            <div class="form-group">
                <label>Image Prompt</label>
                <textarea id="ai-prompt" rows="3" placeholder="e.g., Futuristic cyberpunk city at sunset..."></textarea>
            </div>
            <button class="btn btn-primary" onclick="generateImage()">Generate Image</button>

            <div id="image-result" style="text-align: center; margin-top: 15px;"></div>

            <button class="btn btn-danger" onclick="handleLogout()">Logout</button>
        </div>
    </div>

    <script>
        const homeScreen = document.getElementById('home-screen');
        const loginScreen = document.getElementById('login-screen');
        const signupScreen = document.getElementById('signup-screen');
        const dashboardScreen = document.getElementById('dashboard-screen');

        function showAuth(type) {
            homeScreen.style.display = 'none';
            loginScreen.style.display = 'none';
            signupScreen.style.display = 'none';
            dashboardScreen.style.display = 'none';
            if (type === 'login') {
                loginScreen.style.display = 'block';
            } else {
                signupScreen.style.display = 'block';
            }
        }

        function showHome() {
            homeScreen.style.display = 'block';
            loginScreen.style.display = 'none';
            signupScreen.style.display = 'none';
            dashboardScreen.style.display = 'none';
        }

        function showDashboard() {
            homeScreen.style.display = 'none';
            loginScreen.style.display = 'none';
            signupScreen.style.display = 'none';
            dashboardScreen.style.display = 'block';
        }
    </script>

</body>
</html>
